[[bin]]
name = "04"
path = "src/tutorials/triangle/04_logical_device.rs"
[[bin]]
name = "05"
path = "src/tutorials/triangle/05_window_surface.rs"
[[bin]]
name = "06"
path = "src/tutorials/triangle/06_swap_chain_creation.rs"
[[bin]]
