[package]
name = "vulkan-tuto-ash"
version = "0.0.1"
edition = "2024"
authors = ["eldenhell"]
publish = false

[dependencies]
winit = { version = "0.30", features = ["rwh_06"] }
ash = "0.38"
ash-window = "0.13"
num = "0.4.3"
glam = "0.33.5"

